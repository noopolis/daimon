name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  runtime-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: npm ci

      - name: Build runtime artifact image from release-shaped packages
        shell: bash
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          trap 'rm -rf "$context"' EXIT

          daimon_tarball="$(npm pack --pack-destination "$context" --silent)"
          mneme_tarball="$(npm pack @noopolis/mneme@0.1.1 --pack-destination "$context" --silent)"
          mv "$context/$daimon_tarball" "$context/daimon.tgz"
          mv "$context/$mneme_tarball" "$context/mneme.tgz"
          cp Dockerfile.runtime "$context/Dockerfile.runtime"

          docker buildx build \
            --file "$context/Dockerfile.runtime" \
            --target local-runtime \
            --tag noopolis/spawnfile-runtime-daimon:ci \
            --build-arg PI_VERSION=0.79.10 \
            --load \
            "$context"

      - name: Verify runtime artifact contents
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create noopolis/spawnfile-runtime-daimon:ci noop)"
          trap 'docker rm "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/opt/spawnfile/runtime-installs/daimon/package.json" /tmp/daimon-package.json
          node - <<'NODE'
          const pkg = require("/tmp/daimon-package.json");
          const required = [
            "@noopolis/daimon",
            "@noopolis/mneme",
            "@earendil-works/pi-coding-agent",
            "@earendil-works/pi-ai"
          ];
          for (const name of required) {
            if (!pkg.dependencies?.[name]) {
              throw new Error(`Missing runtime dependency ${name}`);
            }
          }
          NODE
